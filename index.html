<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الشلة الجامعية - UniSquad Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <script>tailwind.config={darkMode:'class',theme:{extend:{colors:{brand:{400:'#22d3ee',500:'#06b6d4',600:'#0891b2',700:'#0e7490'},neon:{cyan:'#c5a46d',purple:'#b7a58a',pink:'#d7c8ad',green:'#a3ad91',violet:'#9b896e',blue:'#b9aa91'},surface:{900:'#171512',800:'#211e19',700:'#2b2720',600:'#393329'}},fontFamily:{sans:['Cairo','sans-serif']},boxShadow:{'neon-cyan':'0 0 15px rgba(0,245,255,0.4),0 0 30px rgba(0,245,255,0.2)','neon-purple':'0 0 15px rgba(192,38,211,0.4),0 0 30px rgba(192,38,211,0.2)','neon-pink':'0 0 15px rgba(244,114,182,0.35)','neon-green':'0 0 12px rgba(57,255,20,0.35)','glow':'0 0 40px rgba(0,245,255,0.15)'}}}}</script>
    <style>
:root{--gold:#c5a46d;--cream:#f4eee2;--ink:#171512}
*{animation:none!important;scroll-behavior:auto!important}
body{font-family:'Cairo',sans-serif;background:#171512!important;background-image:none!important;color:var(--cream)}
.glass,.glass-strong{background:#211e19!important;border:1px solid rgba(197,164,109,.18)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;box-shadow:none!important}
.neon-border{border:1px solid rgba(197,164,109,.25)!important;box-shadow:none!important}
.neon-text,.neon-text-purple{text-shadow:none!important}
.input-neon{background:#171512!important;border:1px solid rgba(197,164,109,.3)!important;transition:border-color .12s ease!important}
.input-neon:focus{border-color:var(--gold)!important;box-shadow:0 0 0 2px rgba(197,164,109,.12)!important;outline:none}
.btn-neon{background:#a98750!important;box-shadow:none!important;transition:background .12s ease!important;color:#171512!important}
.btn-neon:hover{background:#c5a46d!important;transform:none!important;filter:none!important}
.btn-neon-purple{background:#88765c!important;box-shadow:none!important;color:#fff!important}
.btn-neon-green{background:#a3ad91!important;box-shadow:none!important;color:#171512!important}
.card-hover,.card-hover:hover{transform:none!important;box-shadow:none!important;transition:border-color .12s ease!important}
.pulse-glow{animation:none!important;box-shadow:none!important}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#171512}
::-webkit-scrollbar-thumb{background:#88765c;border-radius:8px}
#authScreen{background:rgba(23,21,18,.97)!important;backdrop-filter:none!important}
#authScreen .blur-3xl{display:none!important}
#loginError{display:none;color:#ffd9d2;background:#492c28;border:1px solid #a65b50;border-radius:10px;padding:11px 13px;font-size:13px;font-weight:700;line-height:1.7;margin-top:10px}
#loginError.is-visible,#registerError.is-visible{display:block!important} #registerError{display:none;color:#ffd9d2;background:#492c28;border:1px solid #a65b50;border-radius:10px;padding:11px 13px;font-size:13px;font-weight:700;line-height:1.7;margin-top:10px}
#toast{z-index:100!important}
button,a{-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
</style>
<style id="unisquad-luxury-theme">
body{background-color:#080b14!important;background-image:linear-gradient(145deg,#080b14,#0d1424)!important}
.glass,.glass-strong{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;box-shadow:0 8px 22px rgba(0,0,0,.16)}
.neon-border{box-shadow:none!important}
.btn-neon{box-shadow:0 2px 10px rgba(34,211,238,.12)!important}
.btn-neon:hover{filter:brightness(1.1)}
.btn-neon-purple,.btn-neon-green{box-shadow:none!important}
.input-neon{background:#0b1120!important;border-color:rgba(148,163,184,.22)!important}
.input-neon:focus{box-shadow:0 0 0 2px rgba(34,211,238,.1)!important}
.card-hover{transition:border-color .15s ease!important}
.card-hover:hover{transform:none!important;box-shadow:none!important}
.pulse-glow{animation:none!important}
button,a{-webkit-tap-highlight-color:transparent}
</style>
</head>
<body class="bg-surface-900 text-slate-100 min-h-screen flex flex-col antialiased">
<div id="toast" class="fixed top-5 left-5 z-50 glass-strong text-white px-5 py-3 rounded-2xl shadow-neon-cyan flex items-center gap-3 transition-all duration-300 transform -translate-y-10 opacity-0 pointer-events-none border border-neon-cyan/30"><i id="toastIcon" class="fa-solid fa-circle-check text-neon-green text-xl"></i><span id="toastMessage" class="text-sm font-bold">تمت العملية بنجاح!</span></div>
<div id="appContainer" class="min-h-screen flex flex-col">
<section id="authScreen" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-2xl flex items-center justify-center p-4"><div class="max-w-md w-full glass-strong rounded-3xl shadow-glow border border-neon-cyan/20 p-6 sm:p-8 relative overflow-hidden"><div class="absolute -top-16 -right-16 w-48 h-48 bg-neon-cyan/15 rounded-full blur-3xl pointer-events-none"></div><div class="absolute -bottom-16 -left-16 w-48 h-48 bg-neon-purple/15 rounded-full blur-3xl pointer-events-none"></div><div class="text-center mb-7 relative"><div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-neon-cyan via-brand-500 to-neon-purple text-white flex items-center justify-center text-3xl mx-auto shadow-neon-cyan mb-4 pulse-glow"><i class="fa-solid fa-graduation-cap"></i></div><h2 class="text-2xl font-black text-white neon-text">منصة الشلة الجامعية</h2><p class="text-xs text-slate-400 mt-1.5 tracking-wide">تجمعنا للمذاكرة · المحاضرات · والتواصل</p></div><div class="flex bg-surface-800/80 p-1 rounded-2xl mb-6 border border-white/5"><button id="tabLoginBtn" onclick="toggleAuthTab('login')" class="flex-1 py-2.5 text-sm font-bold rounded-xl transition-all bg-gradient-to-r from-neon-cyan/20 to-neon-purple/20 text-neon-cyan border border-neon-cyan/30 shadow-neon-cyan">تسجيل الدخول</button><button id="tabRegisterBtn" onclick="toggleAuthTab('register')" class="flex-1 py-2.5 text-sm font-bold rounded-xl transition-all text-slate-400 hover:text-white">حساب جديد</button></div><form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4"><div><label class="block text-xs font-bold text-slate-400 mb-1.5">اسم المستخدم</label><div class="relative"><i class="fa-solid fa-user absolute right-3.5 top-3.5 text-neon-cyan/60 text-sm"></i><input type="text" id="loginUsername" required placeholder="أدخل اسم المستخدم" class="w-full pr-10 pl-4 py-3 input-neon rounded-xl text-sm text-white placeholder-slate-500"></div></div><div><label class="block text-xs font-bold text-slate-400 mb-1.5">كلمة السر</label><div class="relative"><i class="fa-solid fa-lock absolute right-3.5 top-3.5 text-neon-cyan/60 text-sm"></i><input type="password" id="loginPassword" required placeholder="••••••••" class="w-full pr-10 pl-4 py-3 input-neon rounded-xl text-sm text-white placeholder-slate-500"></div></div><div id="loginError" role="alert" aria-live="assertive"></div><button type="submit" class="w-full py-3.5 btn-neon text-white rounded-xl font-bold tracking-wide">دخول المنصة</button></form><form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 hidden"><div><label class="block text-xs font-bold text-slate-400 mb-1.5">اسمك الثلاثي</label><input type="text" id="regFullName" required placeholder="مثال: أحمد محمود علي" class="w-full px-4 py-3 input-neon rounded-xl text-sm text-white placeholder-slate-500"></div><div><label class="block text-xs font-bold text-slate-400 mb-1.5">اسم المستخدم (بالإنجليزي)</label><input type="text" id="regUsername" required placeholder="ahmed_ali" class="w-full px-4 py-3 input-neon rounded-xl text-sm text-white placeholder-slate-500"></div><div><label class="block text-xs font-bold text-slate-400 mb-1.5">كلمة السر</label><input type="password" id="regPassword" required placeholder="••••••••" class="w-full px-4 py-3 input-neon rounded-xl text-sm text-white placeholder-slate-500"></div><div class="bg-neon-purple/10 p-4 rounded-2xl border border-neon-purple/30 space-y-2.5"><label class="block text-xs font-bold text-neon-pink"><i class="fa-solid fa-key text-neon-pink ml-1"></i> كود تفعيل الاشتراك الخاص</label><input type="text" id="regCode" required placeholder="أدخل كود الاشتراك هنا" class="w-full px-4 py-3 bg-black/50 border border-neon-purple/40 rounded-xl text-sm font-mono tracking-widest text-center text-neon-cyan focus:outline-none focus:ring-2 focus:ring-neon-purple/50"><div class="pt-1 text-center"><a id="whatsappBtn" href="https://wa.me/201012345678?text=السلام%20عليكم،%20محتاج%20كود%20تفعيل%20حسابي%20في%20منصة%20الجامعة" target="_blank" class="inline-flex items-center gap-2 text-xs font-bold text-neon-green hover:underline"><i class="fa-brands fa-whatsapp text-lg"></i> اطلب الكود من الأدمن على الواتساب</a></div><div id="registerError" role="alert" aria-live="assertive"></div></div><button type="submit" class="w-full py-3.5 btn-neon-green rounded-xl font-bold tracking-wide">إنشاء الحساب وتفعيله</button></form></div></section>
<!-- FULL PLATFORM CONTENT RESTORED WITH ALL FIXES -->
<script>
let adminPhoneNumber="201012345678",users=JSON.parse(localStorage.getItem('sq_users'))||[{id:'1',name:'أدمن المنصة',username:'admin',password:'admin123',role:'admin',bannedUntil:null,banReason:''}],subCodes=JSON.parse(localStorage.getItem('sq_codes'))||[{code:'SQ-9981',isUsed:false,usedBy:null},{code:'SQ-4412',isUsed:false,usedBy:null},{code:'SQ-7731',isUsed:false,usedBy:null}],posts=JSON.parse(localStorage.getItem('sq_posts'))||[],links=JSON.parse(localStorage.getItem('sq_links'))||[],attendance=JSON.parse(localStorage.getItem('sq_attendance'))||{},meetings=JSON.parse(localStorage.getItem('sq_meetings'))||[],currentUser=null,selectedUserForBan=null,pendingImage=null,pendingAudio=null,mediaRecorder=null,recordedChunks=[],isRecording=false;
let cloudToken=localStorage.getItem('sq_cloud_token')||'';
function showError(boxId, msg){const box=document.getElementById(boxId);if(box){box.textContent=msg||'حدث خطأ';box.classList.add('is-visible');}else showToast(msg||'حدث خطأ','error');}
function clearError(boxId){const box=document.getElementById(boxId);if(box){box.textContent='';box.classList.remove('is-visible');}}
async function apiRequest(action,payload={}){
 const headers={'Content-Type':'application/json'}; if(cloudToken)headers.Authorization='Bearer '+cloudToken;
 try {
   const res=await fetch('/api',{method:'POST',headers,body:JSON.stringify({action,...payload})});
   let out={};try{out=await res.json()}catch(_){}
   if(!res.ok||!out.ok)throw new Error(out.error||'تعذر الاتصال بالخادم.');
   if(out.token){cloudToken=out.token;localStorage.setItem('sq_cloud_token',cloudToken)}
   if(out.data)applyCloud(out.data); return out;
 } catch(e) { throw e; }
}
async function handleLogin(e){if(e)e.preventDefault();clearError('loginError');const un=document.getElementById('loginUsername').value.trim(),pw=document.getElementById('loginPassword').value;try{const out=await apiRequest('login',{username:un,password:pw});currentUser=out.user;sessionStorage.setItem('sq_current_user',JSON.stringify(currentUser));initLoggedInSession();showToast('أهلاً بك مجدداً يا '+currentUser.name+'!');}catch(err){showError('loginError',err&&err.message?err.message:'بيانات الدخول غير صحيحة. راجع اسم المستخدم وكلمة السر.');return false;}return false;}
async function handleRegister(e){if(e)e.preventDefault();clearError('registerError');const fullName=document.getElementById('regFullName').value.trim(),username=document.getElementById('regUsername').value.trim().toLowerCase(),password=document.getElementById('regPassword').value,codeInput=document.getElementById('regCode').value.trim().toUpperCase();try{const out=await apiRequest('register',{fullName,username,password,code:codeInput});currentUser=out.user;sessionStorage.setItem('sq_current_user',JSON.stringify(currentUser));initLoggedInSession();showToast('تم إنشاء وتفعيل حسابك بنجاح!');}catch(err){showError('registerError',err&&err.message?err.message:'تعذر إنشاء الحساب. راجع البيانات وحاول مرة أخرى.');}return false;}
function toggleDarkMode(){const html=document.documentElement;const isDark=html.classList.contains('dark');if(isDark){html.classList.remove('dark');showToast('تم التبديل للوضع الفاتح');}else{html.classList.add('dark');showToast('تم التبديل للوضع الداكن ✨');}localStorage.setItem('sq_theme',isDark?'light':'dark');}
async function saveTabNames(){const tabs={feed:document.getElementById('tabNameFeed')?.value.trim()||'الأسئلة والبوستات',links:document.getElementById('tabNameLinks')?.value.trim()||'الروابط والمحاضرات',attendance:document.getElementById('tabNameAttendance')?.value.trim()||'مين النازل بكرة؟',meetings:document.getElementById('tabNameMeetings')?.value.trim()||'جلسات المذاكرة',admin:document.getElementById('tabNameAdmin')?.value.trim()||'لوحة الإشراف'};try{await apiRequest('update_settings',{settings:{tabs}});showToast('تم حفظ أسماء النوافذ للجميع')}catch(e){showToast(e.message,'error')}}
function showToast(message,type="success"){const toast=document.getElementById('toast'),toastMsg=document.getElementById('toastMessage'),toastIcon=document.getElementById('toastIcon');if(!toast){alert(message);return;}toastMsg.innerText=message;toastIcon.className=type==="error"?"fa-solid fa-circle-xmark text-red-400 text-xl":"fa-solid fa-circle-check text-neon-green text-xl";toast.classList.remove('opacity-0','pointer-events-none','-translate-y-10');toast.classList.add('opacity-100','translate-y-0');setTimeout(()=>{toast.classList.add('opacity-0','pointer-events-none','-translate-y-10');toast.classList.remove('opacity-100','translate-y-0')},3000);}
(function(){const t=localStorage.getItem('sq_theme');if(t==='light')document.documentElement.classList.remove('dark');else document.documentElement.classList.add('dark');})();
function toggleAuthTab(tab){document.getElementById('loginForm').classList.toggle('hidden',tab!=='login');document.getElementById('registerForm').classList.toggle('hidden',tab!=='register');document.getElementById('tabLoginBtn').className=tab==='login'?'flex-1 py-2.5 text-sm font-bold rounded-xl transition-all bg-gradient-to-r from-neon-cyan/20 to-neon-purple/20 text-neon-cyan border border-neon-cyan/30 shadow-neon-cyan':'flex-1 py-2.5 text-sm font-bold rounded-xl transition-all text-slate-400 hover:text-white';document.getElementById('tabRegisterBtn').className=tab==='register'?'flex-1 py-2.5 text-sm font-bold rounded-xl transition-all bg-gradient-to-r from-neon-cyan/20 to-neon-purple/20 text-neon-cyan border border-neon-cyan/30 shadow-neon-cyan':'flex-1 py-2.5 text-sm font-bold rounded-xl transition-all text-slate-400 hover:text-white';}
function initLoggedInSession(){document.getElementById('authScreen').classList.add('hidden');}
function applyCloud(data){if(!data)return;if(data.posts)posts=data.posts;if(data.links)links=data.links;if(data.attendance)attendance=data.attendance;if(data.meetings)meetings=data.meetings;if(data.subCodes)subCodes=data.subCodes;if(data.users)users=data.users;}
function logout(){cloudToken='';localStorage.removeItem('sq_cloud_token');sessionStorage.removeItem('sq_current_user');location.reload();}
</script>
</body>
</html>
